services:
  db:
    image: postgres:16-alpine
    container_name: ${STACK_PREFIX:-gpt}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abt_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-abt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema is applied automatically on first boot (fresh volume only)
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abt_user} -d ${POSTGRES_DB:-abt_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gpt-net

  api:
    build: ./backend
    container_name: ${STACK_PREFIX:-gpt}-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-abt_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-abt_tracker}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SOCKET_CORS_ORIGIN: ${SOCKET_CORS_ORIGIN:-${CORS_ORIGIN:-http://localhost:5173}}
      UPLOAD_PATH: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      SEED_KEY: ${SEED_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gpt.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Government}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Administrator}
      INSTANCE_NAME: ${INSTANCE_NAME:-}
      INSTANCE_LOGO_URL: ${INSTANCE_LOGO_URL:-}
      INSTANCE_BRAND_COLOR: ${INSTANCE_BRAND_COLOR:-}
      INSTANCE_SIDEBAR_COLOR: ${INSTANCE_SIDEBAR_COLOR:-}
      INSTANCE_CURRENCY: ${INSTANCE_CURRENCY:-}
      INSTANCE_AREA_LABEL: ${INSTANCE_AREA_LABEL:-}
      INSTANCE_AREA_LABEL_PLURAL: ${INSTANCE_AREA_LABEL_PLURAL:-}
      INSTANCE_CONTACT_EMAIL: ${INSTANCE_CONTACT_EMAIL:-}
      INSTANCE_FOOTER_ORG: ${INSTANCE_FOOTER_ORG:-}
      INSTANCE_FAVICON_URL: ${INSTANCE_FAVICON_URL:-}
      INSTANCE_ACCENT_COLOR: ${INSTANCE_ACCENT_COLOR:-}
      INSTANCE_FEATURES: ${INSTANCE_FEATURES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
    # Loopback-only by default: the VPS fronts this with nginx + TLS.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-5055}:5000"
    volumes:
      - uploads:/app/uploads
    networks:
      - gpt-net

volumes:
  pgdata:
  uploads:

networks:
  gpt-net:
    driver: bridge
